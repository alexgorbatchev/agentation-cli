name: Release Binaries and npm Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install zig
        run: brew install zig

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync npm package versions from the release tag
        run: node ./scripts/setPackageVersions.js "${GITHUB_REF_NAME#v}"

      - name: Install npm packaging dependencies
        run: npm install --ignore-scripts

      - name: Stage platform packages from release archives
        run: node ./scripts/stageNpmPackages.js

      - name: Publish platform packages
        run: |
          set -euo pipefail
          for package_dir in npm/darwin-x64 npm/darwin-arm64 npm/linux-x64 npm/linux-arm64; do
            (
              cd "$package_dir"
              npm publish --access public
            )
          done

      - name: Publish wrapper package
        run: npm publish --access public
